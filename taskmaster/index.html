<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TaskMaster</title>
<style>
  :root{
    --bg:#0e0b1f; --panel:#181332; --panel2:#221b45; --ink:#f4f0ff; --mute:#9a90c8;
    --purple:#bd40ff; --pink:#ff3d9a; --cyan:#27e6ff; --lime:#b6ff3b; --gold:#ffc83d; --line:#3a2f70;
    --shadow:0 0 0 2px var(--line), 6px 6px 0 #05030f;
  }
  @media (prefers-color-scheme: light){
    :root{ --bg:#f6f1ff; --panel:#fff; --panel2:#efe7ff; --ink:#1b1340; --mute:#6b5fa0; --line:#cdbff5; --shadow:0 0 0 2px var(--line), 6px 6px 0 #d9ccff; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 ui-rounded,"Trebuchet MS",system-ui,sans-serif;
    background-image:radial-gradient(circle at 20% -10%,#3b1f7a55,transparent 50%),radial-gradient(circle at 90% 10%,#00e5ff22,transparent 45%);
    min-height:100vh}
  .wrap{max-width:1100px;margin:0 auto;padding:20px 16px 60px}
  header{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;margin-bottom:20px}
  h1{margin:0;font-size:clamp(34px,7vw,56px);letter-spacing:-1px;line-height:1;font-weight:900;
    background:linear-gradient(90deg,var(--pink),var(--gold),var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(3px 3px 0 #05030f55)}
  h1 small{display:block;font-size:13px;letter-spacing:3px;color:var(--mute);-webkit-text-fill-color:var(--mute);font-weight:700;margin-top:6px}
  .hud{background:var(--panel);box-shadow:var(--shadow);border-radius:14px;padding:12px 16px;min-width:260px;flex:1;max-width:380px}
  .hud .row{display:flex;justify-content:space-between;font-weight:800;font-size:14px}
  .bar{height:14px;border-radius:99px;background:var(--panel2);overflow:hidden;margin-top:8px;border:2px solid var(--line)}
  .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--lime),var(--cyan));transition:width .5s cubic-bezier(.2,1.4,.4,1)}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}
  .stat{background:var(--panel);box-shadow:var(--shadow);border-radius:14px;padding:10px 14px;text-align:center}
  .stat b{display:block;font-size:30px;line-height:1.1}
  .stat span{font-size:12px;letter-spacing:2px;color:var(--mute);font-weight:800}
  .stat:nth-child(1) b{color:var(--pink)} .stat:nth-child(2) b{color:var(--gold)} .stat:nth-child(3) b{color:var(--lime)}
  main{display:grid;grid-template-columns:320px 1fr;gap:20px;align-items:start}
  @media(max-width:820px){main{grid-template-columns:1fr}}
  .card{background:var(--panel);box-shadow:var(--shadow);border-radius:16px;padding:16px}
  .card h2{margin:0 0 10px;font-size:15px;letter-spacing:2px;color:var(--cyan)}
  #drop{border:3px dashed var(--line);border-radius:14px;padding:22px 12px;text-align:center;cursor:pointer;transition:.15s;color:var(--mute);font-weight:700}
  #drop:hover,#drop.over{border-color:var(--pink);background:var(--panel2);transform:rotate(-1deg) scale(1.02);color:var(--ink)}
  #drop em{display:block;font-size:34px;font-style:normal}
  textarea,input[type=text]{width:100%;background:var(--panel2);color:var(--ink);border:2px solid var(--line);border-radius:10px;padding:9px 11px;font:inherit}
  textarea{min-height:90px;resize:vertical;margin-top:10px}
  textarea:focus,input:focus{outline:none;border-color:var(--cyan)}
  button{font:inherit;font-weight:800;cursor:pointer;border:0;border-radius:10px;padding:9px 14px;color:#10092b;background:var(--lime);box-shadow:3px 3px 0 #05030f;transition:transform .08s}
  button:hover{transform:translate(-1px,-1px)} button:active{transform:translate(3px,3px);box-shadow:none}
  button.alt{background:var(--cyan)} button.hot{background:var(--pink);color:#fff} button.ghost{background:var(--panel2);color:var(--ink)}
  .btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
  .tools input{flex:1;min-width:150px}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
  .chip{background:var(--panel2);border:2px solid var(--line);border-radius:99px;padding:3px 12px;font-size:13px;font-weight:800;cursor:pointer;color:var(--mute);user-select:none}
  .chip{color:var(--c,var(--purple));text-shadow:0 0 10px color-mix(in srgb,var(--c,var(--purple)) 55%,transparent);border-color:var(--c,var(--line))}
  .chip.on{background:var(--c,var(--purple));border-color:var(--c,var(--purple));text-shadow:0 0 10px color-mix(in srgb,var(--c,var(--purple)) 55%,transparent);color:#10092b}
  .group{margin-bottom:18px}
  .group h3{margin:0 0 8px;font-size:14px;letter-spacing:1.5px;color:var(--c,var(--purple));text-shadow:0 0 10px color-mix(in srgb,var(--c,var(--purple)) 55%,transparent);display:flex;gap:8px;align-items:center}
  .group h3 input[type=color]{appearance:none;border:0;background:none;width:20px;height:20px;padding:0;cursor:pointer}
  .group h3 span{background:var(--panel2);border-radius:99px;padding:0 9px;color:var(--ink);font-size:12px}
  .task{display:flex;gap:10px;align-items:flex-start;background:var(--panel2);border:2px solid var(--line);border-radius:12px;padding:9px 11px;margin-bottom:8px;
    animation:pop .35s cubic-bezier(.2,1.5,.4,1) both;transition:.15s}
  .task:hover{border-color:var(--cyan);transform:translateX(3px)}
  .task.star{border-color:var(--gold);box-shadow:0 0 14px #ffc83d44}
  .task.done{opacity:.55} .task.done .t{text-decoration:line-through}
  @keyframes pop{from{transform:scale(.85) translateY(8px);opacity:0}}
  .task input{appearance:none;width:24px;height:24px;flex:none;margin:1px 0 0;border:3px solid var(--cyan);border-radius:7px;cursor:pointer;display:grid;place-content:center}
  .task input:checked{background:var(--lime);border-color:var(--lime)}
  .task input:checked::after{content:"✔";color:#10092b;font-size:16px;font-weight:900}
  .t{flex:1;word-break:break-word}
  .tag{font-size:11px;font-weight:800;color:var(--mute);letter-spacing:1px;display:block}
  .ic{background:none;box-shadow:none;padding:2px 6px;font-size:18px;color:var(--mute)}
  .ic:hover{transform:scale(1.25)} .star .ic.s{color:var(--gold)}
  .empty{text-align:center;color:var(--mute);padding:40px 10px;font-weight:700}
  .empty em{display:block;font-size:56px;font-style:normal}
  small.hint{color:var(--mute);display:block;margin-top:8px}
  canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:99}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--gold);color:#10092b;font-weight:900;padding:10px 20px;border-radius:12px;box-shadow:4px 4px 0 #05030f;z-index:100;animation:pop .3s both}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div class="wrap">
  <header>
    <h1>TASKMASTER<small>★ ONE LIST TO RULE THEM ALL ★</small></h1>
    <div class="hud">
      <div class="row"><span id="rank">LVL 1 · Rookie</span><span id="xp">0 XP</span></div>
      <div class="bar"><i id="xpbar"></i></div>
    </div>
  </header>

  <div class="stats">
    <div class="stat"><b id="sOpen">0</b><span>OPEN</span></div>
    <div class="stat"><b id="sStar">0</b><span>STARRED</span></div>
    <div class="stat"><b id="sDone">0</b><span>CRUSHED</span></div>
  </div>

  <main>
    <aside>
      <div class="card">
        <h2>▶ FEED THE MASTER</h2>
        <div id="drop"><em>📥</em>Drop your to-do files here<br>or click to pick (.md / .txt)</div>
        <input id="file" type="file" accept=".md,.txt,.markdown,text/*" multiple hidden>
        <textarea id="paste" placeholder="…or paste a checklist.&#10;- [ ] gets imported&#10;- [x] gets ignored"></textarea>
        <div class="btns">
          <button class="alt" id="importPaste">Import paste</button>
          <button class="ghost" id="folder">Pick folder</button>
        </div>
        <input id="dir" type="file" webkitdirectory hidden>
        <small class="hint">Only unchecked <code>- [ ]</code> items come in. Re-import a file and anything you crossed off there leaves the master.</small>
      </div>
      <div class="card" style="margin-top:18px">
        <h2>＋ QUICK ADD</h2>
        <input type="text" id="quick" placeholder="Type a task, press Enter">
      </div>
    </aside>

    <section class="card">
      <div class="tools">
        <input type="text" id="q" placeholder="🔍 Search the master list…">
        <button class="ghost" id="exp">Export .md</button>
        <button class="hot" id="clr">Clear crushed</button>
      </div>
      <div class="chips" id="chips"></div>
      <div id="list"></div>
    </section>
  </main>
</div>

<script>
(() => {
  const KEY = 'taskmaster.v1';
  const $ = s => document.querySelector(s);
  let S = { items: [], xp: 0, colors: {} };
  const DEFAULT_COLOR = '#bd40ff';
  try { const r = localStorage.getItem(KEY); if (r) S = JSON.parse(r); } catch (e) {}
  S.colors ||= {};
  const colorOf = src => (S.colors[src] && S.colors[src] !== '#b57bff') ? S.colors[src] : DEFAULT_COLOR;
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };

  let filter = 'ALL', query = '', showDone = true;
  const norm = t => t.toLowerCase().replace(/\s+/g, ' ').trim();
  const uid = () => Math.random().toString(36).slice(2, 10);
  const RANKS = ['Rookie','Task Tamer','List Lancer','Chore Champion','Backlog Slayer','Productivity Wizard','TaskMaster Supreme'];
  const lvlOf = xp => Math.floor(Math.sqrt(xp / 25)) + 1;

  // ---- parsing: unchecked checkbox lines only, remembers nearest heading ----
  function parse(text) {
    const out = []; let head = '';
    for (const line of text.split(/\r?\n/)) {
      const h = line.match(/^\s{0,3}#{1,6}\s+(.*?)\s*#*\s*$/);
      if (h) { head = h[1]; continue; }
      const m = line.match(/^\s*(?:[-*+]|\d+[.)])\s+\[( |x|X)\]\s+(.*\S)\s*$/);
      if (m && m[1] === ' ') out.push({ text: m[2].replace(/\s+/g, ' '), tag: head });
    }
    return out;
  }

  function sync(source, parsed) {
    let added = 0, removed = 0;
    S.colors[source] ||= DEFAULT_COLOR;
    const want = new Map(parsed.map(p => [norm(p.text), p]));
    const before = S.items.length;
    S.items = S.items.filter(i => i.src !== source || i.done || want.has(norm(i.text)));
    removed = before - S.items.length;
    for (const [k, p] of want) {
      const dup = S.items.find(i => i.src === source && norm(i.text) === k);
      if (dup) { dup.tag = p.tag; continue; }
      S.items.push({ id: uid(), text: p.text, tag: p.tag, src: source, done: false, star: false, at: Date.now() });
      added++;
    }
    save(); render();
    toast(`📥 ${source}: +${added} new${removed ? `, ${removed} cleared` : ''}`);
  }

  // ---- rendering ----
  function render() {
    const open = S.items.filter(i => !i.done), done = S.items.filter(i => i.done);
    $('#sOpen').textContent = open.length;
    $('#sStar').textContent = open.filter(i => i.star).length;
    $('#sDone').textContent = done.length;
    const lv = lvlOf(S.xp), base = 25 * (lv - 1) ** 2, next = 25 * lv ** 2;
    $('#rank').textContent = `LVL ${lv} · ${RANKS[Math.min(lv - 1, RANKS.length - 1)]}`;
    $('#xp').textContent = `${S.xp} XP`;
    $('#xpbar').style.width = ((S.xp - base) / (next - base) * 100) + '%';

    const srcs = ['ALL', ...new Set(S.items.map(i => i.src))];
    if (!srcs.includes(filter)) filter = 'ALL';
    $('#chips').innerHTML = srcs.map(s =>
      `<span class="chip ${s === filter ? 'on' : ''}" data-s="${esc(s)}" style="--c:${s === 'ALL' ? DEFAULT_COLOR : colorOf(s)}">${esc(s)}</span>`).join('');

    const qn = query.toLowerCase();
    const vis = S.items.filter(i => (filter === 'ALL' || i.src === filter) && (!qn || i.text.toLowerCase().includes(qn)));
    if (!vis.length) {
      $('#list').innerHTML = `<div class="empty"><em>${S.items.length ? '🔎' : '🏰'}</em>${S.items.length ? 'Nothing matches.' : 'The master list is empty. Feed it some files!'}</div>`;
      return;
    }
    const groups = {};
    vis.forEach(i => (groups[i.src] ||= []).push(i));
    $('#list').innerHTML = Object.entries(groups).map(([src, arr]) => {
      arr.sort((a, b) => a.done - b.done || b.star - a.star || a.at - b.at);
      return `<div class="group" style="--c:${colorOf(src)}"><h3>📜 ${esc(src)} <input type="color" data-src="${esc(src)}" value="${colorOf(src)}" title="Change color"> <span>${arr.filter(a => !a.done).length} open</span></h3>` +
        arr.map(i => `<div class="task ${i.star ? 'star' : ''} ${i.done ? 'done' : ''}" data-id="${i.id}">
          <input type="checkbox" ${i.done ? 'checked' : ''}>
          <div class="t">${esc(i.text)}${i.tag ? `<span class="tag"># ${esc(i.tag)}</span>` : ''}</div>
          <button class="ic s" data-a="star" title="Star">${i.star ? '★' : '☆'}</button>
          <button class="ic" data-a="del" title="Remove">✕</button></div>`).join('') + '</div>';
    }).join('');
  }
  const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  // ---- interactions ----
  $('#list').addEventListener('click', e => {
    const el = e.target.closest('.task'); if (!el) return;
    const it = S.items.find(i => i.id === el.dataset.id); if (!it) return;
    const a = e.target.dataset.a;
    if (a === 'star') it.star = !it.star;
    else if (a === 'del') S.items = S.items.filter(i => i !== it);
    else if (e.target.type === 'checkbox') {
      it.done = e.target.checked;
      const gain = it.star ? 25 : 10;
      const oldLv = lvlOf(S.xp);
      S.xp = Math.max(0, S.xp + (it.done ? gain : -gain));
      if (it.done) {
        const r = e.target.getBoundingClientRect(); boom(r.left + 12, r.top + 12);
        if (lvlOf(S.xp) > oldLv) { toast(`🎉 LEVEL UP! You are now LVL ${lvlOf(S.xp)}`); boom(innerWidth / 2, innerHeight / 3, 140); }
        else if (!S.items.some(i => !i.done)) { toast('🏆 BOARD CLEARED!'); boom(innerWidth / 2, innerHeight / 3, 200); }
      }
    } else return;
    save(); render();
  });
  $('#list').addEventListener('change', e => { if (e.target.type === 'color') { S.colors[e.target.dataset.src] = e.target.value; save(); render(); } });
  $('#chips').addEventListener('click', e => { if (e.target.dataset.s) { filter = e.target.dataset.s; render(); } });
  $('#q').addEventListener('input', e => { query = e.target.value; render(); });
  $('#quick').addEventListener('keydown', e => {
    if (e.key !== 'Enter' || !e.target.value.trim()) return;
    S.colors['Quick Add'] ||= DEFAULT_COLOR;
    S.items.push({ id: uid(), text: e.target.value.trim(), tag: '', src: 'Quick Add', done: false, star: false, at: Date.now() });
    e.target.value = ''; save(); render();
  });
  $('#clr').onclick = () => { S.items = S.items.filter(i => !i.done); save(); render(); };
  $('#importPaste').onclick = () => {
    const p = parse($('#paste').value);
    if (!p.length) return toast('No unchecked "- [ ]" items found');
    sync('Pasted ' + new Date().toLocaleDateString(), p); $('#paste').value = '';
  };
  $('#exp').onclick = () => {
    const by = {}; S.items.filter(i => !i.done).forEach(i => (by[i.src] ||= []).push(i));
    const md = '# TaskMaster\n\n' + Object.entries(by).map(([s, a]) =>
      `## ${s}\n` + a.map(i => `- [ ] ${i.star ? '⭐ ' : ''}${i.text}`).join('\n')).join('\n\n') + '\n';
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([md], { type: 'text/markdown' }));
    a.download = 'TaskMaster.md'; a.click();
  };

  async function readFiles(files) {
    for (const f of files) {
      if (!/\.(md|markdown|txt)$/i.test(f.name)) continue;
      sync(f.name.replace(/\.(md|markdown|txt)$/i, ''), parse(await f.text()));
    }
  }
  const drop = $('#drop');
  drop.onclick = () => $('#file').click();
  $('#file').onchange = e => { readFiles(e.target.files); e.target.value = ''; };
  $('#folder').onclick = () => $('#dir').click();
  $('#dir').onchange = e => { readFiles(e.target.files); e.target.value = ''; };
  ['dragenter', 'dragover'].forEach(v => drop.addEventListener(v, e => { e.preventDefault(); drop.classList.add('over'); }));
  ['dragleave', 'drop'].forEach(v => drop.addEventListener(v, e => { e.preventDefault(); drop.classList.remove('over'); }));
  drop.addEventListener('drop', e => readFiles(e.dataTransfer.files));

  // ---- confetti ----
  const cv = $('#fx'), cx = cv.getContext('2d'); let parts = [];
  const fit = () => { cv.width = innerWidth; cv.height = innerHeight; }; fit(); addEventListener('resize', fit);
  function boom(x, y, n = 40) {
    const cols = ['#ff3d9a', '#27e6ff', '#b6ff3b', '#ffc83d', '#fff'];
    for (let i = 0; i < n; i++) parts.push({ x, y, vx: (Math.random() - .5) * 12, vy: Math.random() * -11 - 2, r: 3 + Math.random() * 4, c: cols[i % 5], l: 70 + Math.random() * 30 });
    if (parts.length === n) tick();
  }
  function tick() {
    cx.clearRect(0, 0, cv.width, cv.height);
    parts = parts.filter(p => p.l-- > 0);
    for (const p of parts) { p.vy += .35; p.x += p.vx; p.y += p.vy; cx.fillStyle = p.c; cx.fillRect(p.x, p.y, p.r, p.r * 1.6); }
    if (parts.length) requestAnimationFrame(tick); else cx.clearRect(0, 0, cv.width, cv.height);
  }
  function toast(msg) {
    document.querySelectorAll('.toast').forEach(t => t.remove());
    const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
    document.body.appendChild(t); setTimeout(() => t.remove(), 2600);
  }

  render();
})();
</script>
</body>
</html>
